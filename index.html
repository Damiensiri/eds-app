<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ecurie Damien SIRI</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5c8f">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ecurie DS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#1f5c8f;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* Bande bleue safe pour iOS */
#topSafe{
  height:env(safe-area-inset-top);
  background:#1f5c8f;
}

/* Header app */
#header{
  height:64px;
  background:#1f5c8f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:600;
}

/* Zone Wix */
#app{
  height:calc(100vh - 64px - env(safe-area-inset-top));
}

iframe{
  width:100%;
  height:100%;
  border:0;
}
</style>
</head>

<body>

<div id="topSafe"></div>

<div id="header">
  ECURIE DAMIEN SIRI
</div>

<div id="app">
  <iframe
    src="https://www.ce-dugrandrang.com/app1"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>
</div>

</body>
</html>
