<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EDS App</title>

<!-- OneSignal SDK -->
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];

OneSignalDeferred.push(async function(OneSignal) {

  await OneSignal.init({
    appId: "fbee04c7-49b9-4888-9572-4197486366a3",

    notifyButton: {
      enable: false
    }
  });

  // 🔔 Force l'affichage de la demande de permission
  OneSignal.showSlidedownPrompt();

});
</script>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#1f5c8f;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

#box{
  text-align:center;
}

h1{
  font-size:22px;
  margin-bottom:10px;
}

p{
  opacity:0.8;
}
</style>

</head>

<body>

<div id="box">
  <h1>EDS Application</h1>
  <p>Initialisation des notifications...</p>
</div>

</body>
</html>
